name: Publish to Chrome Web Store

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-chrome
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Resolve version
        id: version
        run: |
          VERSION="$(bun -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install
        run: make install

      - name: Typecheck
        run: make typecheck

      - name: Build store zip
        run: make release-chrome

      - name: Submit to Chrome Web Store
        run: make submit-chrome
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      # The backend's review-version cron runs `make sync` once this version is live on the store.
      - name: Set backend Review_Version
        uses: appleboy/ssh-action@v1
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BACKEND_PATH: ${{ secrets.BACKEND_PATH }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: VERSION,BACKEND_PATH
          script: |
            set -euo pipefail
            export PATH="$HOME/.bun/bin:$PATH"
            cd "$BACKEND_PATH"
            make set-review-version VERSION="$VERSION"
